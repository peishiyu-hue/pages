<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>四腿组合 · 实时看板</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Microsoft YaHei",system-ui,-apple-system,sans-serif;background:#0f1420;color:#e8edf5;padding:28px 32px}
@media(max-width:640px){body{padding:16px 14px}}
h1{font-size:20px;font-weight:600;letter-spacing:.5px}
.sub{color:#7c8aa5;font-size:12.5px;margin-top:6px;line-height:1.6}
.sum{margin:22px 0 26px;display:flex;gap:18px;align-items:stretch;flex-wrap:wrap}
.card{background:#182031;border:1px solid #232e45;border-radius:12px;padding:16px 20px;min-width:170px;flex:1 1 170px}
.card .k{color:#7c8aa5;font-size:12px}
.card .v{font-size:27px;font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums}
.up{color:#ff5f56}.dn{color:#2ecc71}.flat{color:#c9d4e6}
table{width:100%;border-collapse:collapse;margin-top:8px;font-variant-numeric:tabular-nums}
th,td{padding:12px 10px;text-align:right;border-bottom:1px solid #1e2739;font-size:14px;white-space:nowrap}
th{color:#7c8aa5;font-weight:500;font-size:12px;text-align:right}
th:first-child,td:first-child{text-align:left}
tr:last-child td{border-bottom:none}
.tag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:5px;background:#233047;color:#8fa3c4;margin-left:8px}
.foot{color:#5d6b85;font-size:11.5px;margin-top:18px;line-height:1.8}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
</style></head><body>
<h1>四腿组合 · 实时看板</h1>
<div class="sub" id="sub">正在取数…</div>

<div class="sum">
  <div class="card"><div class="k">今日加权涨跌</div><div class="v flat" id="wchg">--</div></div>
  <div class="card"><div class="k">组合权重</div><div class="v" style="font-size:18px">45 / 30 / 15 / 10</div></div>
  <div class="card"><div class="k">再平衡</div><div class="v" style="font-size:18px">每季度</div></div>
  <div class="card"><div class="k">距下次再平衡</div><div class="v" style="font-size:18px" id="next">--</div></div>
</div>

<div class="scroll">
<table><thead><tr><th>标的</th><th>权重</th><th>现价</th><th>昨收</th><th>今日涨跌</th><th>成交额(亿)</th></tr></thead>
<tbody id="rows"><tr><td colspan="6" style="text-align:left;color:#7c8aa5">正在取数…</td></tr></tbody></table>
</div>

<div class="foot">
  口径：涨跌＝现价÷昨收−1；加权涨跌＝各腿涨跌×权重。<br>
  数据源：腾讯行情公开接口（准实时）｜每 30 秒自动刷新｜页面为纯静态，任何设备直接打开即可看。<br>
  ★ 本页只做监测，不构成买卖建议。买入前请另行核对<b>折溢价</b>（纳指腿尤其）。
</div>

<script>
var LEGS=[
  {code:'sh512890', name:'红利低波ETF华泰柏瑞', w:45},
  {code:'sz159941', name:'纳指ETF广发',         w:30},
  {code:'sh511220', name:'城投债ETF海富通',     w:15},
  {code:'sh518880', name:'黄金ETF华安',         w:10}
];

function cls(v){ return v>0 ? 'up' : (v<0 ? 'dn' : 'flat'); }
function fmt(v,n){ return (v==null||isNaN(v)) ? '--' : v.toFixed(n==null?3:n); }

function nextRebalance(){
  var t=new Date(), y=t.getFullYear();
  var q=[[2,31],[5,30],[8,30],[11,31]];
  for(var i=0;i<q.length;i++){
    var d=new Date(y,q[i][0],q[i][1]);
    if(d>t){ return d; }
  }
  return new Date(y+1,2,31);
}

function renderNext(){
  var d=nextRebalance();
  var days=Math.ceil((d-new Date())/(1000*60*60*24));
  document.getElementById('next').textContent=d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()+'（'+days+'天）';
}

function render(quotes){
  var total=0, rows='', okAny=false;
  LEGS.forEach(function(L){
    var q=quotes[L.code];
    if(!q){ rows+='<tr><td>'+L.name+'<span class="tag">'+L.code.slice(2)+'</span></td><td>'+L.w+'%</td><td colspan="4" style="color:#7c8aa5">取数失败</td></tr>'; return; }
    okAny=true;
    var chg=(q.prev>0)? ((q.price/q.prev-1)*100) : 0;
    total+=chg*L.w/100;
    rows+='<tr><td>'+L.name+'<span class="tag">'+L.code.slice(2)+'</span></td>'
        + '<td>'+L.w+'%</td><td>'+fmt(q.price)+'</td><td>'+fmt(q.prev)+'</td>'
        + '<td class="'+cls(chg)+'">'+(chg>0?'+':'')+chg.toFixed(2)+'%</td>'
        + '<td>'+(q.amount? q.amount.toFixed(2) : '--')+'</td></tr>';
  });
  document.getElementById('rows').innerHTML=rows;
  var e=document.getElementById('wchg');
  if(okAny){ e.textContent=(total>0?'+':'')+total.toFixed(2)+'%'; e.className='v '+cls(total); }
  else { e.textContent='--'; e.className='v flat'; }
}

function load(){
  var url='https://qt.gtimg.cn/q='+LEGS.map(function(l){return l.code;}).join(',');
  fetch(url,{cache:'no-store'})
    .then(function(r){ return r.arrayBuffer(); })
    .then(function(buf){
      var txt=new TextDecoder('gbk').decode(buf);
      var quotes={}, stamp='';
      txt.split(';').forEach(function(line){
        var m=line.match(/v_([a-z]{2}\d+)\s*=\s*"([^"]*)"/);
        if(!m) return;
        var f=m[2].split('~');
        if(f.length<40) return;
        quotes[m[1]]={ name:f[1], price:parseFloat(f[3]), prev:parseFloat(f[4]),
                       pct:parseFloat(f[32]), amount:parseFloat(f[37])/10000 };
        var t=(f[30]||'').match(/^(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})/);
        if(t) stamp=t[1]+'-'+t[2]+'-'+t[3]+' '+t[4]+':'+t[5];
      });
      render(quotes);
      document.getElementById('sub').innerHTML='数据源：腾讯行情公开接口（准实时）｜每 30 秒自动刷新｜行情时间：'+(stamp||'--')
            +'｜本页更新时间：'+new Date().toLocaleTimeString('zh-CN');
    })
    .catch(function(e){
      document.getElementById('sub').innerHTML='取数失败（'+e.message+'）—— 请检查网络后刷新'
            +'｜本页更新时间：'+new Date().toLocaleTimeString('zh-CN');
      render({});
    });
}

renderNext();
load();
setInterval(load,30000);
setInterval(renderNext,60000);
</script>
</body></html>
